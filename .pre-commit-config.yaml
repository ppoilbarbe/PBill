repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types_or: [kotlin, xml, yaml, toml, markdown]
      - id: end-of-file-fixer
        types_or: [kotlin, xml, yaml, toml, markdown]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        types_or: [kotlin, xml, yaml, toml]

  - repo: local
    hooks:
      - id: android-lint
        name: Android Lint
        entry: make lint
        language: system
        pass_filenames: false
        types_or: [kotlin, xml]

      - id: unit-tests
        name: Unit tests (JVM)
        entry: make test
        language: system
        pass_filenames: false
        types_or: [kotlin]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
        # Latest LTS release of Node.js: by default nodeenv takes the latest
        # release, which can be a pre-release it cannot parse (27.0.0-alpha)
        language_version: lts
