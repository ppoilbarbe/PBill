# Continuous integration: on every push and pull request, runs the unit tests
# and Android Lint, then builds the release APK, kept as a workflow artifact.
# On a version tag (v1.2.3) only, also creates the GitHub release of the tag
# with the APK, whose text is the CHANGELOG.md section of the version
# (tools/extract_changelog.py).
# On a push to main only, also updates the rolling "Development build"
# pre-release: the dev-build tag is moved to the pushed commit and the APK is
# replaced, published under a fixed name (pbill-dev.apk) for a stable
# download URL.
#
# The APK is signed when the repository secrets are available (not on pull
# requests from forks), otherwise left unsigned:
#   PBILL_KEYSTORE_BASE64    the PKCS12 keystore, base64-encoded (base64 -w0 file.p12)
#   PBILL_KEYSTORE_PASSWORD  its password (also the key password)
#   PBILL_KEY_ALIAS          the key alias
name: CI

on:
  push:
    branches: ["**"]
    # Semver tags only (glob syntax: + quantifier not supported by GitHub)
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

# Cancel in-flight runs for the same ref when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tests and APK ────────────────────────────────────────────────────────────
  build:
    name: Tests and APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Same JDK and SDK packages as a local build (make tools-install)
      - name: Install the JDK and the Android SDK
        run: make tools-jdk tools-sdk

      - name: Unit tests
        run: make test

      - name: Android Lint
        run: make lint

      - name: Build the APK
        env:
          PBILL_KEYSTORE_BASE64: ${{ secrets.PBILL_KEYSTORE_BASE64 }}
          PBILL_KEYSTORE_PASSWORD: ${{ secrets.PBILL_KEYSTORE_PASSWORD }}
          PBILL_KEY_ALIAS: ${{ secrets.PBILL_KEY_ALIAS }}
        run: |
          if [ -n "$PBILL_KEYSTORE_BASE64" ]; then
            export PBILL_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            echo "$PBILL_KEYSTORE_BASE64" | base64 -d > "$PBILL_KEYSTORE_FILE"
            make release-apk
            rm -f "$PBILL_KEYSTORE_FILE"
          else
            echo "::warning::No signing secrets: building an unsigned APK"
            make build
            mkdir -p dist
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/pbill-unsigned.apk
          fi

      - name: Check that the tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          apk="dist/pbill-${GITHUB_REF_NAME#v}.apk"
          [ -f "$apk" ] || { echo "::error::$apk missing: does the tag match versionName (and are the signing secrets set)?"; exit 1; }

      - name: Keep the APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/pbill-*.apk
          if-no-files-found: error

  # ── Release (version tags only) ──────────────────────────────────────────────
  release:
    name: GitHub release
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Get the APK
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: Extract changelog entry for ${{ github.ref_name }}
        id: changelog
        run: python3 tools/extract_changelog.py

      - name: Create the GitHub release with the APK
        uses: softprops/action-gh-release@v3
        with:
          name: PBill ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/pbill-*.apk
          fail_on_unmatched_files: true

  # ── Development build (main only) ────────────────────────────────────────────
  dev-build:
    name: Development build
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Get the APK
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: Move the dev-build tag to this commit
        run: |
          git tag -f dev-build "$GITHUB_SHA"
          git push -f origin refs/tags/dev-build

      - name: Update the Development build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed asset name: stable download URL across versions
          apks=(dist/pbill-*.apk)
          [ ${#apks[@]} -eq 1 ] || { echo "::error::expected one APK, got: ${apks[*]}"; exit 1; }
          cp "${apks[0]}" dist/pbill-dev.apk
          notes="Development build of commit ${GITHUB_SHA::7}, not a stable release."
          if gh release view dev-build >/dev/null 2>&1; then
            gh release edit dev-build --title "Development build" \
              --prerelease --latest=false --notes "$notes"
            gh release upload dev-build dist/pbill-dev.apk --clobber
          else
            gh release create dev-build dist/pbill-dev.apk --verify-tag \
              --title "Development build" --prerelease --latest=false --notes "$notes"
          fi
